name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Check shell syntax and media dependencies
        run: |
          for script in install.sh scripts/*.sh tests/*.sh tests/fixtures/*.sh; do
            bash -n "$script" || exit 1
          done
          bash scripts/doctor.sh

      - name: Run local media workflow and recovery tests
        run: python -m unittest discover -s tests -v

      - name: Lint skills (structure + secret scan)
        run: bash tests/lint_skills.sh

      - name: Generate synthetic fixtures
        run: bash tests/fixtures/make_fixtures.sh

      - name: Cutting agent test
        run: bash tests/test_cutting.sh

      - name: QC gate test (pass + fail)
        run: bash tests/test_qc.sh

  installer:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check installation and safe reruns
        run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Smoke-test the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HERMES_HOME = "$env:RUNNER_TEMP/framecrew-hermes"
          $env:FRAMECREW_NO_PAUSE = "1"
          & '.\Install FrameCrew.cmd' --skills-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(Get-ChildItem "$env:HERMES_HOME/skills/video" -Filter SKILL.md -Recurse).Count -ne 13) { exit 1 }
      - name: Smoke-test the macOS launcher
        if: runner.os == 'macOS'
        run: |
          export HERMES_HOME="$RUNNER_TEMP/framecrew-hermes"
          bash "Install FrameCrew.command" --skills-only
          test "$(find "$HERMES_HOME/skills/video" -name SKILL.md | wc -l | tr -d ' ')" -eq 13
