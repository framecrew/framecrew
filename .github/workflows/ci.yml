name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Check shell syntax and media dependencies
        run: |
          for script in install.sh scripts/*.sh tests/*.sh tests/fixtures/*.sh; do
            bash -n "$script" || exit 1
          done
          bash scripts/doctor.sh

      - name: Run local media workflow and recovery tests
        run: python -m unittest discover -s tests -v

      - name: Lint skills (structure + secret scan)
        run: bash tests/lint_skills.sh

      - name: Generate synthetic fixtures
        run: bash tests/fixtures/make_fixtures.sh

      - name: Cutting agent test
        run: bash tests/test_cutting.sh

      - name: QC gate test (pass + fail)
        run: bash tests/test_qc.sh
